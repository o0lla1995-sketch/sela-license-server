<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>سيلا — لوحة إدارة الاشتراكات</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F97316'/%3E%3Cpath d='M18 26h28l-3 22a6 6 0 0 1-6 5H27a6 6 0 0 1-6-5l-3-22z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 26v-4a8 8 0 0 1 16 0v4' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3Ctext x='32' y='49' font-family='Arial' font-weight='900' font-size='15' fill='%23F97316' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" rx="16" fill="#F97316"/><path d="M18 26h28l-3 22a6 6 0 0 1-6 5H27a6 6 0 0 1-6-5l-3-22z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M24 26v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="32" y="49" font-family="Arial" font-weight="900" font-size="15" fill="#F97316" text-anchor="middle">S</text></svg>
    </div>
    <h1>لوحة إدارة سيلا</h1>
    <p class="dim">إدارة التراخيص والاشتراكات والأرباح</p>
    <form id="loginForm" autocomplete="on">
      <label for="loginEmail">البريد الإلكتروني</label>
      <input id="loginEmail" type="email" autocomplete="username" required autofocus>
      <label for="loginPass">كلمة المرور</label>
      <div class="pass-wrap">
        <input id="loginPass" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="loginEye" aria-label="إظهار كلمة المرور">👁</button>
      </div>
      <div id="loginError" class="form-error hidden"></div>
      <button type="submit" class="btn primary block" id="loginBtn">تسجيل الدخول</button>
    </form>
    <p class="dim tiny">الدخول محمي — تُسجَّل كل محاولات الدخول</p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="34" height="34"><rect width="64" height="64" rx="14" fill="#F97316"/><path d="M18 26h28l-3 22a6 6 0 0 1-6 5H27a6 6 0 0 1-6-5l-3-22z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M24 26v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="32" y="49" font-family="Arial" font-weight="900" font-size="15" fill="#F97316" text-anchor="middle">S</text></svg>
      <div class="brand-text">
        <b>سيلا</b>
        <small>لوحة الإدارة</small>
      </div>
    </div>
    <nav class="nav" id="mainNav">
      <a href="#/dashboard" data-nav="dashboard">لوحة المعلومات</a>
      <a href="#/keys" data-nav="keys">المفاتيح</a>
      <a href="#/payments" data-nav="payments">المدفوعات</a>
      <a href="#/contacts" data-nav="contacts">بيانات التواصل</a>
      <a href="#/admins" data-nav="admins" class="owner-only">المشرفون</a>
      <a href="#/audit" data-nav="audit">سجل الأحداث</a>
      <a href="#/settings" data-nav="settings">الإعدادات</a>
    </nav>
    <div class="user-chip">
      <div class="user-info">
        <b id="userName"></b>
        <small id="userEmail"></small>
      </div>
      <button class="btn ghost small" id="logoutBtn">خروج</button>
    </div>
  </header>

  <main id="view"></main>

  <footer class="footer">سيلا — نظام إدارة الاشتراكات · <span id="serverClock"></span></footer>
</div>

<!-- ══════════ MODAL ══════════ -->
<div id="modalBack" class="modal-back hidden">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
