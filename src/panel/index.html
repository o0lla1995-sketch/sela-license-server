<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>سيلا — لوحة الإدارة</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3.2">
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-card">
    <img class="login-logo" src="icon-512.png" alt="سيلا">
    <h1>لوحة إدارة سيلا</h1>
    <p class="dim">إدارة التراخيص، الموقع، والتواصل</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginEmail">البريد الإلكتروني</label>
        <input id="loginEmail" class="input" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="loginPass">كلمة المرور</label>
        <div class="pass-wrap">
          <input id="loginPass" class="input" type="password" autocomplete="current-password" required>
          <button type="button" class="eye" id="loginEye" aria-label="إظهار كلمة المرور">👁</button>
        </div>
      </div>
      <div id="loginError" class="form-error hidden"></div>
      <button type="submit" class="btn primary block" id="loginBtn">تسجيل الدخول</button>
    </form>
    <p class="dim tiny" style="margin-top:16px">الدخول محمي — تُسجَّل كل محاولات الدخول</p>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="appView" class="app hidden">

  <!-- mobile topbar -->
  <div class="topbar">
    <button class="burger" id="burgerBtn" aria-label="القائمة">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="t-title" id="topTitle">لوحة المعلومات</span>
    <span class="t-user" id="topUser">م</span>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-handle" id="sidebarHandle" aria-label="طي أو فتح القائمة" title="طي/فتح القائمة">
      <svg class="hh-a" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>
      <svg class="hh-b" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5"/><path d="M6 17l5-5-5-5"/></svg>
    </button>
    <div class="sidebar-head">
      <img src="icon-512.png" alt="سيلا">
      <div>
        <b>سيلا</b>
        <small>لوحة الإدارة</small>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav" id="mainNav">
      <span class="nav-group-title">الرئيسية</span>
      <button class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="nav-label">لوحة المعلومات</span>
      </button>

      <span class="nav-group-title">التراخيص والمالية</span>
      <button class="nav-item" data-nav="keys">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.3 12.7L20 3m-4 1l3 3m-6 0l3 3"/></svg>
        <span class="nav-label">المفاتيح</span>
      </button>
      <button class="nav-item" data-nav="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M2 10.5h20"/><path d="M6 15h4"/></svg>
        <span class="nav-label">المدفوعات</span>
      </button>

      <span class="nav-group-title">الموقع</span>
      <button class="nav-item" data-nav="landing">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H4z"/><path d="M4 5l8 7 8-7"/><path d="M9 20h6"/><path d="M12 16v4"/></svg>
        <span class="nav-label">صفحة الهبوط</span>
      </button>
      <button class="nav-item" data-nav="contact">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">التواصل</span>
      </button>

      <span class="nav-group-title">النظام</span>
      <button class="nav-item" data-nav="admins" id="navAdmins" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">المشرفون</span>
      </button>
      <button class="nav-item" data-nav="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg>
        <span class="nav-label">سجل الأحداث</span>
      </button>
      <button class="nav-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">الإعدادات</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="avatar" id="userAvatar">م</div>
      <div class="who">
        <b id="userName">—</b>
        <small id="userEmail">—</small>
      </div>
      <button class="btn ghost small" id="logoutBtn" title="تسجيل الخروج">
        <svg class="lo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="nav-label">خروج</span>
      </button>
    </div>
  </aside>

  <!-- main -->
  <div class="main-col">
    <main class="content" id="view"></main>
    <footer class="panel-footer">سيلا — نظام إدارة الاشتراكات · <span id="serverClock"></span></footer>
  </div>
</div>

<!-- ══════════ MODAL ══════════ -->
<div id="modalBack" class="modal-back hidden">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple hidden>

<script src="app.js?v=3.2"></script>
</body>
</html>
